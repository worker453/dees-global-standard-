<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dees Global - Admin</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.container{max-width:1000px;margin:auto;background:#fff;padding:20px;border-radius:8px}
h2{color:#232f3e}
input,select{padding:8px;margin:4px;width:200px;border:1px solid #ccc;border-radius:4px}
.btn{background:#e47911;color:#fff;border:none;padding:10px 16px;border-radius:4px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ddd;padding:8px;text-align:left}
th{background:#232f3e;color:#fff}
</style>
</head>
<body>
<div class="container">
  <h2>Dees Global Admin Dashboard</h2>
  <a href="index.html">← Back to Store</a>

  <h3>Add / Edit Product</h3>
  <input id="pName" placeholder="Product Name">
  <input id="pCategory" placeholder="Category e.g Food">
  <input id="pImg" placeholder="Image URL">
  <input id="pStock" type="number" placeholder="Stock">
  <input id="pMOQ" type="number" placeholder="MOQ">
  <input id="p1" type="number" placeholder="Price 1-9">
  <input id="p2" type="number" placeholder="Price 10-49">
  <input id="p3" type="number" placeholder="Price 50+">
  <button class="btn" onclick="saveProduct()">Save Product</button>

  <h3>Products</h3>
  <table id="productTable"></table>

  <h3>Orders</h3>
  <table id="orderTable"></table>
</div>

<script>
let products = JSON.parse(localStorage.getItem('dees_products')) || [];
let orders = JSON.parse(localStorage.getItem('dees_orders')) || [];

function saveProduct(){
  let prod = {
    id:Date.now(), name:pName.value, category:pCategory.value, img:pImg.value, 
    stock:parseInt(pStock.value), moq:parseInt(pMOQ.value),
    tiers:[
      {min:1,max:9,price:parseInt(p1.value)},
      {min:10,max:49,price:parseInt(p2.value)},
      {min:50,max:999,price:parseInt(p3.value)}
    ]
  };
  products.push(prod);
  localStorage.setItem('dees_products', JSON.stringify(products));
  alert('Product Saved!');
  loadProducts();
}

function loadProducts(){
  productTable.innerHTML = "<tr><th>Name</th><th>Stock</th><th>MOQ</th><th>Price Tiers</th><th>Action</th></tr>" +
  products.map((p,i)=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.moq}</td>
  <td>${p.tiers.map(t=>`${t.min}-${t.max}: ₦${t.price}`).join('<br>')}</td>
  <td><button onclick="deleteProd(${i})">Delete</button></td></tr>`).join('');
}

function deleteProd(i){
  products.splice(i,1);
  localStorage.setItem('dees_products', JSON.stringify(products));
  loadProducts();
}

function loadOrders(){
  orderTable.innerHTML = "<tr><th>Order ID</th><th>Items</th><th>Total</th><th>Ref</th></tr>" +
  orders.map(o=>`<tr><td>${o.id}</td><td>${o.items.map(i=>i.name+' x'+i.qty).join(', ')}</td><td>₦${o.total.toLocaleString()}</td><td>${o.ref}</td></tr>`).join('');
}

loadProducts(); loadOrders();
</script>
</body>
</html>

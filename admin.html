<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dees Global - Admin</title>
<style>
body{font-family:Arial;background:#232f3e;margin:0;padding:20px}
.login-box{background:#fff;padding:30px;border-radius:8px;width:320px;margin:100px auto;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.login-box h2{text-align:center;color:#e47911;margin-bottom:20px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
.btn{background:#e47911;color:#fff;border:none;padding:12px;width:100%;border-radius:4px;cursor:pointer;font-size:16px;font-weight:700}
.btn:hover{background:#cc6a0e}
.btn-green{background:#067d62}.btn-red{background:#d32f2f}.btn-orange{background:#f68b1e}
.container{max-width:1200px;margin:20px auto;background:#fff;padding:20px;border-radius:8px;display:none}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}
th{background:#232f3e;color:#fff}
.logout{float:right;background:#555;padding:6px 12px;font-size:12px;color:#fff;border:none;border-radius:4px;cursor:pointer}
.section{background:#f1f1f2;padding:15px;margin:20px 0;border-radius:8px}
.preview{width:80px;height:80px;object-fit:cover;border-radius:4px;margin-top:8px}
.success{color:#067d62;font-weight:700}
label{font-weight:700}
.out-of-stock{color:#d32f2f;font-weight:700}
.in-stock{color:#067d62;font-weight:700}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h2>Admin Login</h2>
  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<div class="container" id="adminPanel">
  <button class="btn logout" onclick="logout()">Logout</button>
  <h2>Dees Global Admin Dashboard</h2>
  <a href="index.html">← Back to Store</a>

  <div class="section" style="background:#d4edda">
    <h3>1. Delivery Settings</h3>
    <p>Current Delivery Fee: <b>₦<span id="currentFee">50000</span></b></p>
    <input id="newFee" type="number" placeholder="Enter New Delivery Fee">
    <button class="btn" onclick="updateDeliveryFee()">Update Delivery Fee</button>
    <p id="feeMsg" class="success"></p>
  </div>

  <div class="section">
    <h3>2. Add Product</h3>
    <input id="pName" placeholder="Product Name">
    <input id="pPrice" type="number" placeholder="Price">
    <input id="pStock" type="number" placeholder="Stock Quantity">
    <label>Upload Image:</label>
    <input id="pImgFile" type="file" accept="image/*">
    <img id="pImgPreview" class="preview" style="display:none">
    <button class="btn" onclick="saveProduct()">Save Product</button>
  </div>

  <div class="section" style="background:#ffeeba">
    <h3>3. Add Promo Product</h3>
    <input id="promoName" placeholder="Promo Product Name">
    <input id="promoPrice" type="number" placeholder="Promo Price">
    <input id="promoOldPrice" type="number" placeholder="Old Price">
    <input id="promoStock" type="number" placeholder="Stock Quantity">
    <label>Upload Image:</label>
    <input id="promoImgFile" type="file" accept="image/*">
    <img id="promoImgPreview" class="preview" style="display:none">
    <button class="btn-orange" onclick="savePromo()">Add to Promos</button>
  </div>

  <h3>All Products</h3>
  <table id="productTable"></table>

  <h3>Promo Products</h3>
  <table id="promoTable"></table>

  <h3>All Orders from Customers</h3>
  <table id="orderTable"></table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, setDoc, getDoc, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBka5c4PYa1rXpR8b3xDZnUmSTssqzOKWo",
  authDomain: "dees-global-standard.firebaseapp.com",
  projectId: "dees-global-standard",
  storageBucket: "dees-global-standard.firebasestorage.app",
  messagingSenderId: "1094953495657",
  appId: "1:1094953495657:web:6356bafa8527f5259346f8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

let pImgURL = "";
let promoImgURL = "";

pImgFile.onchange = e => {
  const file = e.target.files[0];
  pImgPreview.src = URL.createObjectURL(file);
  pImgPreview.style.display = 'block';
}
promoImgFile.onchange = e => {
  const file = e.target.files[0];
  promoImgPreview.src = URL.createObjectURL(file);
  promoImgPreview.style.display = 'block';
}

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadDeliveryFee(); loadProducts(); loadPromos(); loadOrders();
  }
});

window.login = async () => {
  try { await signInWithEmailAndPassword(auth, email.value, password.value); } 
  catch(e) { alert(e.message); }
}
window.logout = () => signOut(auth);

async function uploadImage(file, folder) {
  const storageRef = ref(storage, `${folder}/${Date.now()}_${file.name}`);
  const snap = await uploadBytes(storageRef, file);
  return await getDownloadURL(snap.ref);
}

async function loadDeliveryFee() {
  const docSnap = await getDoc(doc(db, "settings", "delivery"));
  if(docSnap.exists()) document.getElementById('currentFee').innerText = docSnap.data().fee.toLocaleString();
}
window.updateDeliveryFee = async () => {
  const newFee = parseInt(newFee.value);
  await setDoc(doc(db, "settings", "delivery"), { fee: newFee });
  document.getElementById('currentFee').innerText = newFee.toLocaleString();
  feeMsg.innerText = 'Updated!'; setTimeout(()=>feeMsg.innerText='',2000);
}

window.saveProduct = async () => {
  const file = pImgFile.files[0];
  if(!file) { alert('Upload image'); return; }
  pImgURL = await uploadImage(file, 'products');
  await addDoc(collection(db, "products"), {
    name: pName.value, price: parseInt(pPrice.value), stock: parseInt(pStock.value), img: pImgURL
  });
  alert('Product Saved!');
  pName.value = pPrice.value = pStock.value = ''; pImgFile.value = ''; pImgPreview.style.display='none';
  loadProducts();
}

async function loadProducts(){
  const snapshot = await getDocs(collection(db, "products"));
  productTable.innerHTML = "<tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Action</th></tr>" +
  snapshot.docs.map(d=>{
    const data = d.data();
    const stockClass = data.stock > 0? 'in-stock' : 'out-of-stock';
    return `<tr>
    <td><img src="${data.img}" class="preview"></td>
    <td>${data.name}</td><td>₦${data.price.toLocaleString()}</td>
    <td class="${stockClass}">${data.stock}</td>
    <td><button class="btn-red" onclick="deleteItem('products','${d.id}')">Delete</button></td>
  </tr>`}).join('');
}

window.savePromo = async () => {
  const file = promoImgFile.files[0];
  if(!file) { alert('Upload image'); return; }
  promoImgURL = await uploadImage(file, 'promos');
  await addDoc(collection(db, "promos"), {
    name: promoName.value, price: parseInt(promoPrice.value), oldPrice: parseInt(promoOldPrice.value), stock: parseInt(promoStock.value), img: promoImgURL
  });
  alert('Promo Added!');
  promoName.value = promoPrice.value = promoOldPrice.value = promoStock.value = ''; promoImgFile.value = ''; promoImgPreview.style.display='none';
  loadPromos();
}

async function loadPromos(){
  const snapshot = await getDocs(collection(db, "promos"));
  promoTable.innerHTML = "<tr><th>Image</th><th>Name</th><th>Promo</th><th>Old</th><th>Stock</th><th>Action</th></tr>" +
  snapshot.docs.map(d=>{
    const data = d.data();
    const stockClass = data.stock > 0? 'in-stock' : 'out-of-stock';
    return `<tr>
    <td><img src="${data.img}" class="preview"></td>
    <td>${data.name}</td><td>₦${data.price.toLocaleString()}</td><td>₦${data.oldPrice.toLocaleString()}</td>
    <td class="${stockClass}">${data.stock}</td>
    <td><button class="btn-red" onclick="deleteItem('promos','${d.id}')">Remove</button></td>
  </tr>`}).join('');
}

window.deleteItem = async (col, id) => {
  await deleteDoc(doc(db, col, id));
  loadProducts(); loadPromos();
}

async function loadOrders(){
  const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
  const snapshot = await getDocs(q);
  orderTable.innerHTML = "<tr><th>Code</th><th>Customer</th><th>Items</th><th>Total</th><th>Type</th><th>Status</th></tr>" +
  snapshot.docs.map(d=>{
    const o = d.data();
    return `<tr>
      <td><b>${o.code}</b></td>
      <td>${o.customer.name}<br>${o.customer.phone}</td>
      <td>${o.items.map(i=>i.name+' x'+i.qty).join('<br>')}</td>
      <td>₦${o.total.toLocaleString()}</td>
      <td>${o.deliveryType}</td>
      <td>${o.status}</td>
    </tr>`
  }).join('');
}
</script>
</body>
</html>

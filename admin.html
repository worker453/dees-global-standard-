<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dees Global - Admin</title>
<style>
body{font-family:Arial;background:#232f3e;margin:0;padding:20px}
.login-box{background:#fff;padding:30px;border-radius:8px;width:320px;margin:100px auto;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.login-box h2{text-align:center;color:#e47911;margin-bottom:20px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}
.btn{background:#e47911;color:#fff;border:none;padding:12px;width:100%;border-radius:4px;cursor:pointer;font-size:16px}
.btn:hover{background:#cc6a0e}
.btn-green{background:#067d62}.btn-red{background:#d32f2f}
.container{max-width:1200px;margin:20px auto;background:#fff;padding:20px;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:left;vertical-align:top}
th{background:#232f3e;color:#fff}
.logout{float:right;background:#555;padding:6px 12px;font-size:12px;color:#fff;border:none;border-radius:4px;cursor:pointer}
.section{background:#f1f1f2;padding:15px;margin:20px 0;border-radius:8px}
.status{padding:4px 8px;border-radius:4px;font-weight:700}
.success{color:#067d62}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
  <h2>Admin Login</h2>
  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
</div>

<div class="container" id="adminPanel" style="display:none">
  <button class="btn logout" onclick="logout()">Logout</button>
  <h2>Dees Global Admin Dashboard</h2>
  <a href="index.html">← Back to Store</a>

  <!-- SECTION 1: DELIVERY SETTINGS -->
  <div class="section">
    <h3>1. Delivery Settings</h3>
    <label><b>Current Delivery Fee: ₦<span id="currentFee">50000</span></b></label>
    <input id="newFee" type="number" placeholder="Enter New Delivery Fee">
    <button class="btn" onclick="updateDeliveryFee()">Update Delivery Fee</button>
    <p id="feeMsg" class="success"></p>
  </div>

  <!-- SECTION 2: ADD PRODUCTS -->
  <div class="section">
    <h3>2. Add Product</h3>
    <input id="pName" placeholder="Product Name">
    <input id="pPrice" type="number" placeholder="Price">
    <input id="pImg" placeholder="Image URL">
    <button class="btn" onclick="saveProduct()">Save Product</button>
  </div>

  <h3>All Orders from Customers</h3>
  <table id="orderTable">
    <thead><tr><th>Code</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Action</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, setDoc, getDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBka5c4PYa1rXpR8b3xDZnUmSTssqzOKWo",
  authDomain: "dees-global-standard.firebaseapp.com",
  projectId: "dees-global-standard",
  storageBucket: "dees-global-standard.firebasestorage.app",
  messagingSenderId: "1094953495657",
  appId: "1:1094953495657:web:6356bafa8527f5259346f8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, user => {
  if(user) {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadDeliveryFee();
    loadOrders();
  }
});

window.login = async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  try { await signInWithEmailAndPassword(auth, email, password); } 
  catch(e) { alert(e.message); }
}

window.logout = () => signOut(auth);

// LOAD CURRENT DELIVERY FEE
async function loadDeliveryFee() {
  const docRef = doc(db, "settings", "delivery");
  const docSnap = await getDoc(docRef);
  if(docSnap.exists()) {
    document.getElementById('currentFee').innerText = docSnap.data().fee.toLocaleString();
  }
}

// UPDATE DELIVERY FEE
window.updateDeliveryFee = async () => {
  const newFee = parseInt(document.getElementById('newFee').value);
  if(!newFee || newFee < 0) { alert('Enter valid amount'); return; }
  
  await setDoc(doc(db, "settings", "delivery"), { fee: newFee });
  document.getElementById('currentFee').innerText = newFee.toLocaleString();
  document.getElementById('feeMsg').innerText = 'Delivery fee updated successfully!';
  document.getElementById('newFee').value = '';
  setTimeout(()=>document.getElementById('feeMsg').innerText='',3000);
}

async function loadOrders() {
  const q = query(collection(db, "orders"), orderBy("createdAt", "desc"));
  const snapshot = await getDocs(q);
  const tbody = document.querySelector('#orderTable tbody');
  
  if(snapshot.empty) { tbody.innerHTML = '<tr><td colspan="6">No orders yet</td></tr>'; return; }

  tbody.innerHTML = snapshot.docs.map(docSnap => {
    const o = docSnap.data();
    return `
      <tr>
        <td><b>${o.code}</b></td>
        <td>${o.customer.name}<br>${o.customer.phone}<br>${o.customer.address}</td>
        <td>${o.items.map(i=>i.name+' x'+i.qty).join('<br>')}</td>
        <td>₦${o.total.toLocaleString()}<br><small>Delivery: ₦${o.deliveryFee.toLocaleString()}</small></td>
        <td><span class="status" style="background:${o.status==='Pending'?'#fff3cd':'#d4edda'}">${o.status}</span></td>
        <td>
          <button class="btn-green" onclick="updateStatus('${docSnap.id}', 'Delivered')">Delivered</button>
          <button class="btn" onclick="window.open('tel:${o.customer.phone}')">Call</button>
        </td>
      </tr>
    `;
  }).join('');
}

window.updateStatus = async (id, status) => {
  await updateDoc(doc(db, "orders", id), { status });
  alert('Updated to ' + status);
  loadOrders();
}

window.saveProduct = () => alert('Product save coming next');

</script>
</body>
</html>

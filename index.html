<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dees Global Standard</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--primary:#f68b1e;--dark:#313133;--bg:#f1f1f2;--card:#fff;--success:#008a00;--danger:#e4002b}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,Arial,sans-serif}
  html,body{overflow-x:hidden!important;width:100%;max-width:100%}
  body{padding-bottom:70px;background:var(--bg)}

.topbar{background:var(--card);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 4px rgba(0,0,0,.1);display:flex;justify-content:space-between;align-items:center}
.searchbar{display:flex;align-items:center;background:var(--bg);border-radius:8px;padding:12px 16px;flex:1}
.searchbar input{border:none;background:none;flex:1;outline:none;font-size:15px}

.call-banner{background:var(--card);padding:14px 16px;font-weight:700;font-size:16px;border-bottom:1px solid #eee}

.section{background:var(--card);padding:16px;margin-bottom:10px}
.section-title{font-weight:700;font-size:18px;margin-bottom:12px}
.products-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.p-card{min-width:160px;background:var(--card);border:1px solid #eee;border-radius:8px;padding:10px}
.p-card img{width:100%;height:140px;object-fit:cover;border-radius:6px}
.p-name{font-size:14px;height:38px;overflow:hidden;margin:6px 0;line-height:1.3}
.p-price{color:var(--danger);font-weight:700;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.grid-card{background:var(--card);padding:12px;border-radius:8px}
.grid-card img{width:100%;height:160px;object-fit:cover;border-radius:6px}

.btn-orange{background:var(--primary);color:#fff;border:none;padding:14px;border-radius:8px;width:100%;font-weight:700;font-size:16px;cursor:pointer}

.cart-page{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;overflow-y:auto;width:100%}
.cart-page.open{display:block}
.cart-header{background:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.cart-header h2{font-size:20px}
.empty-cart{text-align:center;padding:40px 20px;background:#fff}
.empty-cart img{width:140px;height:140px;margin:0 auto 16px;display:block}

.cart-item{background:#fff;padding:16px;display:flex;gap:12px;margin-bottom:10px}
.cart-item img{width:90px;height:90px;object-fit:cover;border-radius:6px}
.cart-item-info{flex:1}
.cart-item-name{font-weight:600;margin-bottom:4px}
.cart-item-price{color:var(--danger);font-weight:700}
.cart-item-qty{display:flex;align-items:center;gap:10px;margin-top:8px}
.qty-btn{padding:4px 10px;border:1px solid #ddd;background:#fff;border-radius:4px}

.cart-summary{background:#fff;padding:16px;margin-top:10px}

.delivery-alert{background:#fff3cd;color:#856404;padding:12px;border-radius:8px;margin:10px 16px;font-weight:700;text-align:center}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd;z-index:99;width:100%}
.nav-item{text-align:center;font-size:12px;color:#666;font-weight:600;cursor:pointer}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:26px;height:26px;margin-bottom:3px}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:300;justify-content:center;align-items:center}
.modal.open{display:flex}
.modal-content{background:#fff;padding:24px;border-radius:12px;width:90%;max-width:400px}
.modal-content input,.modal-content select,.modal-content textarea{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:15px}
.note{font-size:13px;color:#d32f2f;margin:8px 0}
.delivery-option{border:1px solid #ddd;padding:16px;border-radius:8px;margin:10px 0;cursor:pointer;font-size:15px}
.delivery-option.active{border-color:var(--primary);background:#fff8f0}
</style>
</head>
<body>

<div id="homePage">
  <div class="topbar">
    <div class="searchbar">🔍 <input id="search" placeholder="Search on Dees Global"></div>
    <button id="authBtn" onclick="showAuth()" style="background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:6px;margin-left:8px;font-weight:700">Login</button>
  </div>
  <div class="call-banner">CALL TO ORDER: 09163599546</div>
  
  <div class="delivery-alert">⚡ ₦50,000 FLAT DELIVERY FEE FOR ALL LAGOS ORDERS ⚡</div>
  
  <div class="section"><div class="section-title">Promos</div><div class="products-scroll" id="promoProducts"></div></div>
  <div class="section"><div class="section-title">All Products</div><div class="grid" id="productGrid"></div></div>
</div>

<div id="cartPage" class="cart-page">
  <div class="cart-header"><span onclick="closeCart()" style="font-size:26px;cursor:pointer">←</span><h2>Cart</h2></div>
  <div id="cartContent"></div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="showHome()">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Home
  </div>
  <div class="nav-item" onclick="openCart()">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M7 4V2C7 1.45 6.55 1 6 1S5 1.45 5 2v2H2v2h2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8h2V6h-3V2c0-.55-.45-1-1-1s-1-1 1v2H7zm2 2h10v12c0.55.45 1 1 1H8c-.55 0-1-.45-1-1V6h2z"/></svg>
    Cart <span id="cartCount">0</span>
  </div>
  <div class="nav-item">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    Account
  </div>
</div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">
  <div class="modal-content">
    <h3 style="font-size:20px;margin-bottom:12px">Login / Register</h3>
    <input id="authEmail" type="email" placeholder="Email *">
    <input id="authPassword" type="password" placeholder="Password *">
    <button class="btn-orange" onclick="handleAuth('login')">Login</button>
    <button class="btn-orange" style="background:#666;margin-top:8px" onclick="handleAuth('signup')">Sign Up</button>
    <button style="width:100%;margin-top:8px;background:none;border:none;color:#666" onclick="closeAuth()">Cancel</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div id="checkoutModal" class="modal">
  <div class="modal-content">
    <h3 style="font-size:20px">Checkout Details</h3>
    <input id="custName" placeholder="Full Name *">
    <input id="custPhone" placeholder="Phone Number *">
    <input id="custAddress" placeholder="Full Delivery Address *">
    
    <div style="background:#f1f1f2;padding:16px;border-radius:8px;margin:16px 0">
      <div style="display:flex;justify-content:space-between;font-size:15px"><span>Subtotal:</span><span id="subTotal">₦0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px"><span>Delivery Fee:</span><span id="deliveryFee">₦50,000</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:8px"><span>Total:</span><span id="grandTotal">₦0</span></div>
    </div>

    <button class="btn-orange" onclick="submitCheckout()">Confirm Order</button>
    <button class="btn-orange" style="background:#666;margin-top:10px" onclick="closeCheckout()">Cancel</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBka5c4PYa1rXpR8b3xDZnUmSTssqzOKWo",
  authDomain: "dees-global-standard.firebaseapp.com",
  projectId: "dees-global-standard",
  storageBucket: "dees-global-standard.firebasestorage.app",
  messagingSenderId: "1094953495657",
  appId: "1:1094953495657:web:6356bafa8527f5259346f8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let products = JSON.parse(localStorage.getItem('dees_products')) || [
  {id: 1, name: "Indomie Noodles 40pcs", price: 12000, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=400"},
  {id: 2, name: "Golden Penny Spaghetti", price: 8500, img: "https://images.unsplash.com/photo-1623341214825-9a101b3f3f0c?w=400"},
  {id: 3, name: "Vegetable Oil 5L", price: 15000, img: "https://images.unsplash.com/photo-1474979266404-7eaacb7d30e2?w=400"},
  {id: 4, name: "Bag of Rice 50kg", price: 65000, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},
  {id: 5, name: "Peak Milk 400g", price: 4500, img: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=400"},
  {id: 6, name: "Sugar 50kg", price: 55000, img: "https://images.unsplash.com/photo-1589923188900-85dae523342b?w=400"},
];
let promos = [];
let cart = JSON.parse(localStorage.getItem('dees_cart')) || [];
let currentUser = null;
const DELIVERY_FEE = 50000;

onAuthStateChanged(auth, user => {
  currentUser = user;
  document.getElementById('authBtn').innerText = user? 'Logout' : 'Login';
  if(user) document.getElementById('authBtn').onclick = () => signOut(auth);
});

function generateCode(){ return 'DG' + Math.floor(1000 + Math.random() * 9000); }
window.showHome = () => {document.getElementById('homePage').style.display = 'block';document.getElementById('cartPage').classList.remove('open');}
window.openCart = () => {document.getElementById('homePage').style.display = 'none';document.getElementById('cartPage').classList.add('open');renderCart();}
window.closeCart = () => { showHome(); }

window.showAuth = () => document.getElementById('authModal').classList.add('open');
window.closeAuth = () => document.getElementById('authModal').classList.remove('open');

window.handleAuth = async (type) => {
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;
  if(!email ||!password) { alert('Fill all fields'); return; }
  try {
    if(type === 'signup') await createUserWithEmailAndPassword(auth, email, password);
    else await signInWithEmailAndPassword(auth, email, password);
    closeAuth();
    alert('Success!');
  } catch(e) { alert(e.message); }
}

function renderProducts(){
  let grid = document.getElementById('productGrid');
  grid.innerHTML = products.map(p=>`
    <div class="grid-card">
      <img src="${p.img}">
      <div class="p-name">${p.name}</div>
      <div class="p-price">₦${p.price.toLocaleString()}</div>
      <button class="btn-orange" style="padding:10px;font-size:14px;margin-top:8px" onclick="addToCart(${p.id})">Add to Cart</button>
    </div>
  `).join('');
}

window.addToCart = (id) => {
  let product = products.find(p=>p.id===id);
  let existing = cart.find(c=>c.id===id);
  if(existing){ existing.qty++; existing.total = existing.qty * product.price }
  else{ cart.push({id, name:product.name, img:product.img, qty:1, price:product.price, total:product.price}) }
  localStorage.setItem('dees_cart', JSON.stringify(cart));
  updateCartCount();
  alert(`${product.name} added!`);
}

function updateCartCount(){document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);}

function renderCart(){
  let cartContent = document.getElementById('cartContent');
  if(cart.length === 0){
    cartContent.innerHTML = `<div class="empty-cart"><h3>Your cart is empty!</h3><button class="btn-orange" onclick="closeCart()">Start Shopping</button></div>`;
  } else {
    let subtotal = cart.reduce((a,b)=>a+b.total,0);
    let total = subtotal + DELIVERY_FEE;
    cartContent.innerHTML = `
      ${cart.map((c,i)=>`
        <div class="cart-item">
          <img src="${c.img}">
          <div class="cart-item-info">
            <div class="cart-item-name">${c.name}</div>
            <div class="cart-item-price">₦${c.price.toLocaleString()}</div>
            <div class="cart-item-qty">
              <button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
              <span>${c.qty}</span>
              <button class="qty-btn" onclick="changeQty(${i},1)">+</button>
              <button style="margin-left:auto;color:var(--danger);border:none;background:none" onclick="removeItem(${i})">Remove</button>
            </div>
          </div>
        </div>
      `).join('')}
      <div class="cart-summary">
        <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:12px"><span>Subtotal</span><span>₦${subtotal.toLocaleString()}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span>Delivery Fee</span><span>₦${DELIVERY_FEE.toLocaleString()}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin-bottom:16px"><span>Total</span><span>₦${total.toLocaleString()}</span></div>
        <button class="btn-orange" onclick="openCheckout()">Checkout</button>
      </div>
    `;
  }
}

window.changeQty = (i, val) => {cart[i].qty += val;if(cart[i].qty < 1) cart.splice(i,1);else cart[i].total = cart[i].qty * cart[i].price;localStorage.setItem('dees_cart', JSON.stringify(cart));renderCart(); updateCartCount();}
window.removeItem = (i) => {cart.splice(i,1);localStorage.setItem('dees_cart',JSON.stringify(cart));renderCart(); updateCartCount();}

window.openCheckout = () => {
  if(!currentUser) { alert('Please login first'); showAuth(); return; }
  if(cart.length===0){alert('Cart is empty');return}
  let subtotal = cart.reduce((a,b)=>a+b.total,0);
  document.getElementById('subTotal').innerText = '₦' + subtotal.toLocaleString();
  document.getElementById('grandTotal').innerText = '₦' + (subtotal + DELIVERY_FEE).toLocaleString();
  document.getElementById('checkoutModal').classList.add('open');
}
window.closeCheckout = () => document.getElementById('checkoutModal').classList.remove('open')

window.submitCheckout = async () => {
  let name=document.getElementById('custName').value, phone=document.getElementById('custPhone').value, address=document.getElementById('custAddress').value;
  if(!name||!phone||!address){alert('Fill all fields');return}
  
  let subtotal=cart.reduce((a,b)=>a+b.total,0);
  let total = subtotal + DELIVERY_FEE;
  let code=generateCode();
  
  await addDoc(collection(db, "orders"), {
    code, customer:{name,phone,address}, items:cart, subtotal, deliveryFee:DELIVERY_FEE, total,
    userId: currentUser.uid, email: currentUser.email, status:"Pending", createdAt: serverTimestamp()
  });
  
  cart=[];localStorage.setItem('dees_cart',JSON.stringify(cart));
  updateCartCount();closeCheckout();renderCart();
  alert(`Order placed successfully!\n\nOrder Code: ${code}\nTotal: ₦${total.toLocaleString()}\n\nWe will contact you soon.`);
}

renderProducts();updateCartCount();
</script>
</body>
</html>

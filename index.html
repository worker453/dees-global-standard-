<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dees Global - Wholesale Store</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  :root{--primary:#e47911;--dark:#232f3e;--bg:#eaeded;--card:#fff;--success:#067d62;--danger:#d32f2f}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif}
  body{background:var(--bg)}
  header{background:var(--dark);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:10}
.top{display:flex;gap:12px;align-items:center}
.logo{font-weight:700;font-size:18px;color:var(--primary)}
.search{flex:1;display:flex}
.search input{flex:1;padding:10px;border:none;border-radius:4px 0 0 4px}
.search button{background:var(--primary);border:none;padding:0 16px;border-radius:0 4px 4px 0;cursor:pointer}
.icons{display:flex;gap:16px;font-size:12px;cursor:pointer}
  nav{background:#fff;padding:8px 16px;display:flex;gap:16px;overflow-x:auto}
  nav button{border:none;background:none;cursor:pointer;padding:6px 8px;white-space:nowrap}
.container{max-width:1200px;margin:16px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);padding:12px;border-radius:6px}
.card img{width:100%;height:180px;object-fit:cover;border-radius:4px}
.price{color:#B12704;font-weight:700;margin:4px 0}
.tier{font-size:12px;color:#555}
.stock{font-size:12px;color:var(--success)}
.btn{background:var(--primary);color:#fff;border:none;padding:8px 12px;border-radius:4px;cursor:pointer;width:100%;margin-top:6px}
.btn-alt{background:#ffd814;color:#111}
.btn-danger{background:var(--danger);padding:4px 8px;width:auto}
input.qty{width:70px;padding:4px;border:1px solid #ccc;border-radius:4px}
.cart{position:fixed;right:0;top:0;height:100%;width:350px;background:#fff;box-shadow:-2px 0 8px rgba(0,0,0,.2);transform:translateX(100%);transition:.3s;padding:16px;overflow-y:auto;z-index:20}
.cart.open{transform:translateX(0)}
.cart-item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:8px 0}
.cart-item input[type="checkbox"]{width:18px;height:18px}
.cart-item input.qty{width:50px}
  footer{background:var(--dark);color:#fff;text-align:center;padding:20px;margin-top:40px;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">Dees Global</div>
    <div class="search">
      <input id="search" placeholder="Search products...">
      <button onclick="search()">🔍</button>
    </div>
    <div class="icons">
      <div onclick="toggleCart()">🛒 Cart <span id="cartCount">0</span></div>
      <div><a href="admin.html" style="color:#fff;text-decoration:none">⚙️ Admin</a></div>
    </div>
  </div>
</header>

<nav id="categories"></nav>
<div class="container"><div id="productGrid" class="grid"></div></div>

<div id="cart" class="cart">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <h4>Selected Total: ₦<span id="cartTotal">0</span></h4>
  <button class="btn" onclick="checkout()">Pay Selected with Paystack</button>
  <button class="btn btn-alt" onclick="whatsappOrder()">Order Selected via WhatsApp</button>
  <button onclick="toggleCart()">Close</button>
</div>

<footer>Dees Global | Bank: 9076736714 Palmpay | WhatsApp: 09163599546</footer>

<script>
let products = JSON.parse(localStorage.getItem('dees_products')) || [];
let cart = JSON.parse(localStorage.getItem('dees_cart')) || [];
let orders = JSON.parse(localStorage.getItem('dees_orders')) || [];

function generateCode(){
  return 'DG' + Math.floor(1000 + Math.random() * 9000); // 4 digits. e.g DG4829
}

function renderProducts(filter=""){
  const grid = document.getElementById('productGrid');
  const cats = [...new Set(products.map(p=>p.category))];
  document.getElementById('categories').innerHTML = `<button onclick="renderProducts()">All</button>` + cats.map(c=>`<button onclick="renderProducts('${c}')">${c}</button>`).join('');
  grid.innerHTML = products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()) && (filter==="" || p.category===filter)).map(p=>{
    let price = getPrice(p, p.moq);
    return `<div class="card"><img src="${p.img}"><h4>${p.name}</h4><div class="stock">${p.stock>0?'In Stock':'Out of Stock'}</div><div class="price">From ₦${price.toLocaleString()}</div><div class="tier">${p.tiers.map(t=>`${t.min}-${t.max}: ₦${t.price.toLocaleString()}`).join('<br>')}</div>MOQ: ${p.moq} <br>Qty: <input type="number" id="qty${p.id}" class="qty" value="${p.moq}" min="${p.moq}"><button class="btn" onclick="addToCart(${p.id})">Add to Cart</button></div>`}).join('');
}
function getPrice(product, qty){ let tier = product.tiers.find(t=>qty>=t.min && qty<=t.max) || product.tiers[product.tiers.length-1]; return tier.price; }
function addToCart(id){ let qty = parseInt(document.getElementById('qty'+id).value); let product = products.find(p=>p.id===id); if(qty < product.moq){ alert('Minimum order is '+product.moq); return; } let price = getPrice(product, qty); let existing = cart.find(c=>c.id===id); if(existing){ existing.qty = qty; existing.price = price; existing.total = price*qty; } else{ cart.push({id, name:product.name, qty, price, total:price*qty, selected:true}); } localStorage.setItem('dees_cart', JSON.stringify(cart)); updateCart(); }
function updateCart(){ document.getElementById('cartCount').innerText = cart.length; document.getElementById('cartItems').innerHTML = cart.map((c,i)=>`<div class="cart-item"><input type="checkbox" ${c.selected?'checked':''} onchange="toggleSelect(${i})"><div style="flex:1"><div><b>${c.name}</b></div><div>Qty: <input type="number" class="qty" value="${c.qty}" min="1" onchange="updateQty(${i}, this.value)"> @ ₦${c.price.toLocaleString()}</div><div>Total: ₦${c.total.toLocaleString()}</div></div><button class="btn btn-danger" onclick="removeFromCart(${i})">X</button></div>`).join(''); let selectedTotal = cart.filter(c=>c.selected).reduce((a,b)=>a+b.total,0); document.getElementById('cartTotal').innerText = selectedTotal.toLocaleString(); }
function toggleSelect(i){cart[i].selected=!cart[i].selected;localStorage.setItem('dees_cart', JSON.stringify(cart));updateCart();}
function updateQty(i,val){let qty=parseInt(val);let product=products.find(p=>p.id===cart[i].id);if(qty<product.moq){alert('Minimum order is '+product.moq);return;}cart[i].qty=qty;cart[i].price=getPrice(product,qty);cart[i].total=cart[i].price*qty;localStorage.setItem('dees_cart', JSON.stringify(cart));updateCart();}
function removeFromCart(i){cart.splice(i,1);localStorage.setItem('dees_cart', JSON.stringify(cart));updateCart();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function getSelectedItems(){return cart.filter(c=>c.selected);}

function checkout(){
  let selected=getSelectedItems();let total=selected.reduce((a,b)=>a+b.total,0);if(total===0){alert('Select items to checkout');return;}
  let pickupCode = generateCode();
  let handler=PaystackPop.setup({key:'pk_test_YOUR_PAYSTACK_KEY',email:'customer@email.com',amount:total*100,currency:'NGN',callback:function(response){
      orders.push({id:Date.now(), code:pickupCode, items:selected, total, ref:response.reference, status:"Paid"});
      localStorage.setItem('dees_orders',JSON.stringify(orders));
      cart=cart.filter(c=>!c.selected);localStorage.setItem('dees_cart',JSON.stringify(cart));updateCart();
      alert(`Payment successful!\n\nYour Pickup Code: ${pickupCode}\n\nShow this code to the delivery personnel.`);
  }});handler.openIframe();
}

function whatsappOrder(){
  let selected=getSelectedItems();if(selected.length===0){alert('Select items to order');return;}
  let pickupCode = generateCode();
  orders.push({id:Date.now(), code:pickupCode, items:selected, total:selected.reduce((a,b)=>a+b.total,0), ref:"WhatsApp", status:"Pending Payment"});
  localStorage.setItem('dees_orders',JSON.stringify(orders));
  let msg="New Wholesale Order:%0A" + selected.map(c=>`${c.name} x${c.qty}`).join('%0A') + `%0A%0APickup Code: ${pickupCode}`;
  window.open(`https://wa.me/2349163599546?text=${msg}`);
  alert(`Order sent!\n\nYour Pickup Code: ${pickupCode}\n\nShow this code to the delivery personnel.`);
  cart=cart.filter(c=>!c.selected);localStorage.setItem('dees_cart',JSON.stringify(cart));updateCart();
}

function search(){renderProducts(document.getElementById('search').value);}
renderProducts(); updateCart();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dees Global Standard</title>
<style>
  :root{
    --primary-red: #D00000;
    --primary-green: #004d26;
    --light-bg: #f8f9fa;
  }
  body{font-family:Arial, sans-serif;margin:0;background:var(--light-bg)}
  
  /* HEADER WITH BIG CENTER LOGO */
  header{background:var(--primary-green);color:#fff;padding:20px 15px;text-align:center}
  header img{height:90px;margin-bottom:8px}
  header h1{margin:0;font-size:20px;font-weight:700}
  
  .call-bar{background:#fff;color:#000;text-align:center;padding:10px;font-weight:700;border-bottom:2px solid var(--primary-red)}
  .call-bar span{color:var(--primary-red)}
  
  .banner{background:var(--primary-red);color:#fff;text-align:center;padding:10px;font-weight:700}
  .container{max-width:1200px;margin:20px auto;padding:0 15px}
  
  button{background:var(--primary-red);color:#fff;border:none;padding:10px 15px;border-radius:6px;font-weight:700;cursor:pointer;width:100%}
  button:hover{opacity:0.9}
  
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
  .card{background:#fff;border-radius:8px;padding:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);text-align:center}
  .card img{width:100%;height:150px;object-fit:cover;border-radius:6px}
  .price{color:var(--primary-red);font-size:16px;font-weight:700}
  
  .contact-box{background:#fff;padding:15px;border-radius:8px;margin:20px 0}
  footer{background:var(--primary-green);color:#fff;text-align:center;padding:20px;margin-top:30px}
  
  /* Bottom Nav */
  .bottom-nav{position:fixed;bottom:0;width:100%;background:#fff;display:flex;justify-content:space-around;padding:10px 0;box-shadow:0 -2px 5px rgba(0,0,0,0.1)}
  .bottom-nav div{color:var(--primary-green);font-weight:700;font-size:12px}
</style>
</head>
<body>

<header>
  <img src="YOUR_LOGO_URL_HERE" alt="Dees Global Logo">
  <h1>DEES GLOBAL STANDARD</h1>
</header>

<div class="call-bar">
  CALL TO ORDER: <span id="companyPhone">09163599546</span>
</div>

<div class="banner">
  ⚡ ₦<span id="deliveryFee">2000</span> FLAT DELIVERY FEE FOR LAGOS ⚡
</div>

<div class="container">
  <h2>🔥 Promos</h2>
  <div id="promosGrid" class="grid"></div>

  <h2>📦 All Products</h2>
  <div id="productsGrid" class="grid"></div>

  <div class="contact-box">
    <h3>Payment & Address</h3>
    <p><b>Address:</b> <span id="companyAddress">Loading...</span></p>
    <p><b>Bank Account:</b></p>
    <pre id="companyAccount" style="background:#f1f1f1;padding:10px;border-radius:5px;white-space:pre-wrap">Loading...</pre>
  </div>
</div>

<div class="bottom-nav">
  <div>🏠 Home</div>
  <div>🛒 Cart 0</div>
  <div>👤 Account</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBka5c4PYa1rXpR8b3xDZnUmSTssqzOKWo",
  authDomain: "dees-global-standard.firebaseapp.com",
  projectId: "dees-global-standard",
  storageBucket: "dees-global-standard.firebasestorage.app",
  messagingSenderId: "1094953495657",
  appId: "1:1094953495657:web:6356bafa8527f5259346f8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadStore(){
  // Load Settings
  const feeDoc = await getDoc(doc(db, "settings", "delivery"));
  if(feeDoc.exists()) document.getElementById('deliveryFee').innerText = feeDoc.data().fee.toLocaleString();

  const companyDoc = await getDoc(doc(db, "company", "info"));
  if(companyDoc.exists()){
    document.getElementById('companyPhone').innerText = companyDoc.data().phone || '09163599546';
    document.getElementById('companyAddress').innerText = companyDoc.data().address || 'Not Set';
    document.getElementById('companyAccount').innerText = companyDoc.data().account || 'Not Set';
  }

  // Load Products
  const productsSnap = await getDocs(collection(db, "products"));
  productsGrid.innerHTML = productsSnap.docs.map(d=>{
    const p = d.data();
    return `<div class="card">
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <p class="price">₦${p.price.toLocaleString()}</p>
      <p>Stock: ${p.stock}</p>
      <button>Add to Cart</button>
    </div>`
  }).join('');

  // Load Promos
  const promosSnap = await getDocs(collection(db, "promos"));
  promosGrid.innerHTML = promosSnap.docs.map(d=>{
    const p = d.data();
    return `<div class="card">
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <p class="price">₦${p.price.toLocaleString()}</p>
      <p>Stock: ${p.stock}</p>
      <button>Buy Now</button>
    </div>`
  }).join('');
}
loadStore();
</script>
</body>
</html>

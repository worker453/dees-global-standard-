<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dees Global Standard</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  :root{--primary:#f68b1e;--dark:#313133;--bg:#f1f1f2;--card:#fff;--success:#008a00;--danger:#e4002b}
  *{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,Arial,sans-serif}
  html,body{overflow-x:hidden!important;width:100%;max-width:100%}
  body{padding-bottom:70px;background:var(--bg)}

.topbar{background:var(--card);padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 4px rgba(0,0,0,.1)}
.searchbar{display:flex;align-items:center;background:var(--bg);border-radius:8px;padding:12px 16px}
.searchbar input{border:none;background:none;flex:1;outline:none;font-size:15px}

.call-banner{background:var(--card);padding:14px 16px;font-weight:700;font-size:16px;border-bottom:1px solid #eee}

.section{background:var(--card);padding:16px;margin-bottom:10px}
.section-title{font-weight:700;font-size:18px;margin-bottom:12px}
.products-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.p-card{min-width:160px;background:var(--card);border:1px solid #eee;border-radius:8px;padding:10px}
.p-card img{width:100%;height:140px;object-fit:cover;border-radius:6px}
.p-name{font-size:14px;height:38px;overflow:hidden;margin:6px 0;line-height:1.3}
.p-price{color:var(--danger);font-weight:700;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.grid-card{background:var(--card);padding:12px;border-radius:8px}
.grid-card img{width:100%;height:160px;object-fit:cover;border-radius:6px}

.btn-orange{background:var(--primary);color:#fff;border:none;padding:14px;border-radius:8px;width:100%;font-weight:700;font-size:16px}

.cart-page{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;overflow-y:auto;width:100%}
.cart-page.open{display:block}
.cart-header{background:#fff;padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.cart-header h2{font-size:20px}
.empty-cart{text-align:center;padding:40px 20px;background:#fff}
.empty-cart img{width:140px;height:140px;margin:0 auto 16px;display:block}

.cart-item{background:#fff;padding:16px;display:flex;gap:12px;margin-bottom:10px}
.cart-item img{width:90px;height:90px;object-fit:cover;border-radius:6px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd;z-index:99;width:100%}
.nav-item{text-align:center;font-size:12px;color:#666;font-weight:600}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:26px;height:26px;margin-bottom:3px}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:300;justify-content:center;align-items:center}
.modal.open{display:flex}
.modal-content{background:#fff;padding:24px;border-radius:12px;width:90%}
.delivery-option{border:1px solid #ddd;padding:16px;border-radius:8px;margin:10px 0;cursor:pointer;font-size:15px}
.delivery-option.active{border-color:var(--primary);background:#fff8f0}
.delivery-option.disabled{opacity:0.5;pointer-events:none;background:#f5f5f5}
 select{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:15px}
.note{font-size:13px;color:#d32f2f;margin:8px 0}
</style>
</head>
<body>

<div id="homePage">
  <div class="topbar"><div class="searchbar">🔍 <input id="search" placeholder="Search on Dees Global"></div></div>
  <div class="call-banner">CALL TO ORDER: 09163599546</div>
  <div class="section"><div class="section-title">Promos</div><div class="products-scroll" id="promoProducts"></div></div>
  <div class="section"><div class="section-title">All Products</div><div class="grid" id="productGrid"></div></div>
</div>

<div id="cartPage" class="cart-page">
  <div class="cart-header"><span onclick="closeCart()" style="font-size:26px">←</span><h2>Cart</h2></div>
  <div id="cartContent"></div>
  <div class="section"><div class="section-title">Recently Viewed</div><div class="products-scroll" id="recentProducts"></div></div>
</div>

<!-- BOTTOM NAV - 4 ITEMS ONLY -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="showHome()">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    Home
  </div>
  <div class="nav-item">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 4h4v-4h-4v4z"/></svg>
    Categories
  </div>
  <div class="nav-item" onclick="openCart()">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M7 4V2C7 1.45 6.55 1 6 1S5 1.45 5 2v2H2v2h2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8h2V6h-3V2c0-.55-.45-1-1-1s-1-1 1v2H7zm2 2h10v12c0.55.45 1 1 1H8c-.55 0-1-.45-1-1V6h2z"/></svg>
    Cart <span id="cartCount">0</span>
  </div>
  <div class="nav-item">
    <svg fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    Account
  </div>
</div>

<div id="checkoutModal" class="modal">
  <div class="modal-content">
    <h3 style="font-size:20px">Checkout Details</h3>
    <input id="custName" placeholder="Full Name *" style="width:100%;padding:14px;margin:8px 0;font-size:15px">
    <input id="custPhone" placeholder="Phone Number *" style="width:100%;padding:14px;margin:8px 0;font-size:15px">

    <h4 style="margin-top:16px;font-size:16px">Delivery Method</h4>
    <div id="deliveryOptions"></div>
    <div class="note" id="deliveryNote"></div>

    <div id="addressBox" style="display:none">
      <label><b>Select Your Area:</b></label>
      <select id="custArea" onchange="calculateDelivery()">
        <option value="">-- Choose Area --</option>
        <optgroup label="Lagos Mainland - ₦1,500">
          <option value="1500">Ikeja</option><option value="1500">Surulere</option><option value="1500">Yaba</option>
        </optgroup>
        <optgroup label="Lagos Island - ₦2,500">
          <option value="2500">Lekki</option><option value="2500">Victoria Island</option>
        </optgroup>
        <optgroup label="Other - ₦4,000+">
          <option value="4000">Ogun State</option><option value="4000">Outside Lagos</option>
        </optgroup>
      </select>
      <textarea id="custAddress" placeholder="Full House Address *" rows="3" style="width:100%;padding:14px;margin:8px 0;font-size:15px"></textarea>
    </div>

    <div style="background:#f1f1f2;padding:16px;border-radius:8px;margin:16px 0">
      <div style="display:flex;justify-content:space-between;font-size:15px"><span>Subtotal:</span><span id="subTotal">₦0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px"><span>Total Items:</span><span id="totalQty">0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:15px"><span>Delivery:</span><span id="deliveryFee">₦0</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-top:8px"><span>Total:</span><span id="grandTotal">₦0</span></div>
    </div>

    <button class="btn-orange" onclick="submitCheckout()">Confirm Order</button>
    <button class="btn-orange" style="background:#666;margin-top:10px" onclick="closeCheckout()">Cancel</button>
  </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('dees_products')) || [];
let promos = JSON.parse(localStorage.getItem('dees_promos')) || [];
let cart = JSON.parse(localStorage.getItem('dees_cart')) || [];
let orders = JSON.parse(localStorage.getItem('dees_orders')) || [];
let checkoutType = '';
let deliveryMethod = 'pickup';
let deliveryFee = 0;
const MIN_QTY_FOR_DELIVERY = 50; // CHANGED TO 50 ITEMS

function generateCode(){ return 'DG' + Math.floor(1000 + Math.random() * 9000); }
function showHome(){document.getElementById('homePage').style.display = 'block';document.getElementById('cartPage').classList.remove('open');}
function openCart(){document.getElementById('homePage').style.display = 'none';document.getElementById('cartPage').classList.add('open');renderCart();}
function closeCart(){ showHome(); }

function selectDelivery(method){deliveryMethod = method;deliveryFee = 0;document.querySelectorAll('.delivery-option').forEach(el=>el.classList.remove('active'));event.target.closest('.delivery-option').classList.add('active');if(method === 'delivery'){ document.getElementById('addressBox').style.display = 'block'; } else { document.getElementById('addressBox').style.display = 'none'; }updateCheckoutTotals();}
function calculateDelivery(){deliveryFee = parseInt(document.getElementById('custArea').value) || 0;updateCheckoutTotals();}

function renderDeliveryOptions(totalQty){
  let optionsDiv = document.getElementById('deliveryOptions');
  let noteDiv = document.getElementById('deliveryNote');
  if(totalQty >= MIN_QTY_FOR_DELIVERY){
    optionsDiv.innerHTML = `<div class="delivery-option active" onclick="selectDelivery('pickup')"><b>Pickup at Store</b><br><small>Free</small></div><div class="delivery-option" onclick="selectDelivery('delivery')"><b>Doorstep Delivery</b><br><small>Fee depends on your area</small></div>`;
    noteDiv.innerText = "Free pickup or paid delivery available";deliveryMethod = 'pickup';
  } else {
    let itemsNeeded = MIN_QTY_FOR_DELIVERY - totalQty;
    optionsDiv.innerHTML = `<div class="delivery-option active" onclick="selectDelivery('pickup')"><b>Pickup at Store</b><br><small>Free</small></div><div class="delivery-option disabled"><b>Doorstep Delivery</b><br><small>Available for orders 50 items and above</small></div>`;
    noteDiv.innerText = `Add ${itemsNeeded} more items to qualify for delivery`;deliveryMethod = 'pickup';document.getElementById('addressBox').style.display = 'none';
  }
}

function renderProducts(){
  let grid = document.getElementById('productGrid');
  let promoDiv = document.getElementById('promoProducts');
  if(products.length===0){ grid.innerHTML="<p style='text-align:center;padding:20px;font-size:16px'>Add products from Admin page</p>"; return; }
  grid.innerHTML = products.map(p=>{let price = p.tiers[0].price;return `<div class="grid-card"><img src="${p.img}"><div class="p-name">${p.name}</div><div class="p-price">₦${price.toLocaleString()}</div><button class="btn-orange" style="padding:10px;font-size:14px;margin-top:8px" onclick="addToCart(${p.id})">Add to Cart</button></div>`}).join('');
  promoDiv.innerHTML = promos.map(f=>`<div class="p-card"><img src="${f.img}"><div class="p-name">${f.name}</div><div class="p-price">₦${f.price.toLocaleString()}</div></div>`).join('');
}

function addToCart(id){let product = products.find(p=>p.id===id);let price = product.tiers[0].price;let existing = cart.find(c=>c.id===id);if(existing){ existing.qty++; existing.total = existing.qty * price }else{ cart.push({id, name:product.name, img:product.img, qty:1, price, total:price}) }localStorage.setItem('dees_cart', JSON.stringify(cart));updateCartCount();}
function updateCartCount(){document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);}

function renderCart(){
  let cartContent = document.getElementById('cartContent');
  let totalQty = cart.reduce((a,b)=>a+b.qty,0);
  if(cart.length === 0){cartContent.innerHTML = `<div class="empty-cart"><img src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png"><h3>Your cart is empty!</h3><p>Browse our categories and discover our best deals!</p><button class="btn-orange" onclick="closeCart()">Start Shopping</button></div>`;}
  else {let subtotal = cart.reduce((a,b)=>a+b.total,0);cartContent.innerHTML = `${cart.map((c,i)=>`<div class="cart-item"><img src="${c.img}"><div class="cart-item-info"><div class="cart-item-name">${c.name}</div><div class="cart-item-price">₦${c.price.toLocaleString()}</div><div class="cart-item-qty"><button class="qty-btn" onclick="changeQty(${i},-1)">-</button><span style="font-size:16px">${c.qty}</span><button class="qty-btn" onclick="changeQty(${i},1)">+</button><button style="margin-left:auto;color:var(--danger);border:none;background:none;font-size:14px" onclick="removeItem(${i})">Remove</button></div></div></div>`).join('')}<div class="cart-summary"><div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:12px"><span>Subtotal</span><span>₦${subtotal.toLocaleString()}</span></div><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:15px"><span>Total Items</span><span>${totalQty}</span></div>${totalQty < MIN_QTY_FOR_DELIVERY? `<div class="note">Delivery available for orders 50 items and above</div>` : ''}<div style="background:#fff3cd;padding:14px;border-radius:8px;font-size:14px;margin-bottom:16px"><b>Bank:</b> DEES GLOBAL STANDARD<br><b>Acc:</b> 9076736714 Palmpay</div><button class="btn-orange" onclick="openCheckout('paystack')">Pay with Paystack</button><button class="btn-orange" style="background:#25D366" onclick="openCheckout('whatsapp')">Order via WhatsApp</button></div>`;}
}

function changeQty(i, val){cart[i].qty += val;if(cart[i].qty < 1) cart.splice(i,1);else cart[i].total = cart[i].qty * cart[i].price;localStorage.setItem('dees_cart', JSON.stringify(cart));renderCart(); updateCartCount();}
function removeItem(i){cart.splice(i,1);localStorage.setItem('dees_cart', JSON.stringify(cart));renderCart(); updateCartCount();}
function updateCheckoutTotals(){let subtotal = cart.reduce((a,b)=>a+b.total,0);let totalQty = cart.reduce((a,b)=>a+b.qty,0);document.getElementById('subTotal').innerText = '₦' + subtotal.toLocaleString();document.getElementById('totalQty').innerText = totalQty;document.getElementById('deliveryFee').innerText = '₦' + deliveryFee.toLocaleString();document.getElementById('grandTotal').innerText = '₦' + (subtotal + deliveryFee).toLocaleString();}
function openCheckout(type){if(cart.length===0){alert('Cart is empty');return}checkoutType=type;let totalQty = cart.reduce((a,b)=>a+b.qty,0);renderDeliveryOptions(totalQty);updateCheckoutTotals();document.getElementById('checkoutModal').classList.add('open');}
function closeCheckout(){document.getElementById('checkoutModal').classList.remove('open')}

function submitCheckout(){let name=custName.value, phone=custPhone.value, area=custArea.options[custArea.selectedIndex]?.text, address=custAddress.value;if(!name||!phone){alert('Fill name and phone');return}let totalQty = cart.reduce((a,b)=>a+b.qty,0);if(deliveryMethod==='delivery' && totalQty < MIN_QTY_FOR_DELIVERY){alert('Delivery only available for orders 50 items and above');return}if(deliveryMethod==='delivery' && (!area ||!address)){alert('Please select area and enter address');return}let subtotal=cart.reduce((a,b)=>a+b.total,0);let total = subtotal + deliveryFee;let code=generateCode();let orderData = {id:Date.now(), code,customer:{name,phone,area,address, deliveryMethod, deliveryFee, totalQty},items:cart, subtotal, total,ref:checkoutType==='paystack'? 'Paystack' : 'WhatsApp',status:"Pending"};orders.push(orderData);localStorage.setItem('dees_orders',JSON.stringify(orders));if(checkoutType==='whatsapp'){let msg=`New Order:%0AName: ${name}%0APhone: ${phone}%0ATotal Items: ${totalQty}%0AMethod: ${deliveryMethod}%0AArea: ${area||'Pickup'}%0AAddress: ${address||'N/A'}%0ADelivery Fee: ₦${deliveryFee}%0A%0A${cart.map(c=>c.name+' x'+c.qty+' = ₦'+c.total).join('%0A')}%0A%0ASubtotal: ₦${subtotal}%0ATotal: ₦${total}%0ACode: ${code}`;window.open(`https://wa.me/2349163599546?text=${msg}`);}cart=[];localStorage.setItem('dees_cart',JSON.stringify(cart));updateCartCount();closeCheckout();renderCart();alert(`Order placed!\nPickup/Delivery Code: ${code}\nTotal: ₦${total.toLocaleString()}`);}

renderProducts();updateCartCount();
</script>
</body>
</html>

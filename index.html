<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dees Global Standard</title>
<style>
  :root{
    --primary-red: #D00000;
    --primary-green: #004d26;
    --dark:#313133;
    --bg:#f1f1f2;
    --card:#fff;
    --success:#008a00;
    --danger:#D00000;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,Arial,sans-serif}
  html,body{overflow-x:hidden!important;width:100%;max-width:100%}
  body{padding-bottom:70px;background:var(--bg)}

  /* JUMIA STYLE TOPBAR */
 .topbar{background:var(--primary-green);padding:6px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 4px rgba(0,0,0,.1);display:flex;align-items:center;gap:10px}
 .logo-area{display:flex;align-items:center;gap:8px;flex-shrink:0}
 .logo-area img{height:36px;width:auto;object-fit:contain} /* SMALL LOGO LIKE JUMIA */
 .searchbar{display:flex;align-items:center;background:#fff;border-radius:6px;padding:8px 12px;flex:1}
 .searchbar input{border:none;background:none;flex:1;outline:none;font-size:14px}
 .logout-btn{background:var(--primary-red);color:#fff;border:none;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;flex-shrink:0}

 .call-banner{background:var(--primary-red);padding:12px 16px;font-weight:700;font-size:15px;border-bottom:1px solid #eee;color:#fff;text-align:center}
 .delivery-alert{background:#fff3cd;color:#856404;padding:14px;text-align:center;font-weight:700;margin:10px 0;border-left:4px solid var(--primary-red)}

 .section{background:var(--card);padding:16px;margin-bottom:10px}
 .section-title{font-weight:700;font-size:18px;margin-bottom:12px;color:var(--primary-green)}
 .products-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
 .p-card{min-width:160px;background:var(--card);border:1px solid #eee;border-radius:8px;padding:10px}
 .p-card img{width:100%;height:140px;object-fit:cover;border-radius:6px}
 .p-name{font-size:14px;height:38px;overflow:hidden;margin:6px 0;line-height:1.3}
 .p-price{color:var(--primary-red);font-weight:700;font-size:16px}
 .p-old{color:#666;text-decoration:line-through;font-size:12px}

 .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
 .grid-card{background:var(--card);padding:12px;border-radius:8px;border:1px solid #eee}
 .grid-card img{width:100%;height:160px;object-fit:cover;border-radius:6px}
 .empty-state{text-align:center;padding:60px 20px;color:#666}

 .btn-orange{background:var(--primary-red);color:#fff;border:none;padding:14px;border-radius:8px;width:100%;font-weight:700;font-size:16px;cursor:pointer}
 .btn-orange:hover{opacity:0.9}
 .btn-red{background:var(--primary-red);color:#fff;border:none;padding:10px;border-radius:8px;width:100%;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px}

 .page{display:none;width:100%}
 .page.active{display:block}

 .cart-item{background:#fff;padding:16px;display:flex;gap:12px;margin-bottom:10px}
 .cart-item img{width:90px;height:90px;object-fit:cover;border-radius:6px}
 .cart-item-info{flex:1}
 .cart-item-name{font-weight:600;margin-bottom:4px}
 .cart-item-price{color:var(--primary-red);font-weight:700}
 .cart-item-qty{display:flex;align-items:center;gap:10px;margin-top:8px}
 .qty-btn{padding:4px 10px;border:1px solid #ddd;background:#fff;border-radius:4px}
 .cart-summary{background:#fff;padding:16px;margin-top:10px}
 .delivery-option{border:2px solid #ddd;padding:16px;border-radius:8px;margin:10px 0;cursor:pointer}
 .delivery-option.active{border-color:var(--primary-red);background:#fff5f5}

 .account-welcome{background:var(--primary-green);padding:20px;color:#fff}
 .account-welcome h2{font-size:20px}
 .account-welcome p{color:#fff;opacity:0.9;font-size:14px}
 .account-btns{display:flex;gap:10px;padding:16px}
 .acc-btn{flex:1;padding:14px;border-radius:8px;text-align:center;font-weight:700;text-decoration:none}
 .acc-btn-orange{background:var(--primary-red);color:#fff}
 .acc-btn-outline{border:1px solid var(--primary-green);color:var(--primary-green)}
 .account-list{background:var(--card);margin-top:10px}
 .account-list-item{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #eee;cursor:pointer}

 .order-card{background:#fff;padding:16px;margin:10px 0;border-radius:8px;border:1px solid #eee}
 .order-header{display:flex;justify-content:space-between;margin-bottom:8px}
 .order-code{font-weight:700;color:var(--primary-red)}
 .order-status{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
 .status-pending{background:#fff3cd;color:#856404}
 .status-cancelled{background:#f8d7da;color:#721c24}
 .status-delivered{background:#d4edda;color:#155724}
 .order-items{font-size:13px;color:#666;margin:8px 0}

 .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid var(--primary-green);z-index:99;width:100%}
 .nav-item{text-align:center;font-size:12px;color:#666;font-weight:600;cursor:pointer}
 .nav-item.active{color:var(--primary-red)}
 .nav-item svg{width:26px;height:26px;margin-bottom:3px}

 .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:300;justify-content:center;align-items:center}
 .modal.open{display:flex}
 .modal-content{background:#fff;padding:24px;border-radius:12px;width:90%;max-width:400px}
 .modal-content input{width:100%;padding:14px;margin:8px 0;border:1px solid #ccc;border-radius:6px;font-size:15px}
</style>
</head>
